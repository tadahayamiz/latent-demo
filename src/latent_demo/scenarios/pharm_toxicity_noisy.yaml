scenario:
  id: pharm_toxicity_noisy
  title_ja: ノイズが大きい検査値データで潜在状態を推定する
  description_ja: >
    基本シナリオよりも測定項目ごとの固有ノイズを大きくした人工データを扱う。
    PCAが分散の大きい変数に引っ張られる場合や、因子分析の固有ノイズ推定の意味を確認する。

dataset:
  n_samples: 240
  seed: 123
  noise_level: 1.10
  missing_rate: 0.0
  standardize: true
  latent_correlation:
    - [1.0, 0.30, 0.05]
    - [0.30, 1.0, 0.15]
    - [0.05, 0.15, 1.0]

latent_factors:
  - id: liver_injury
    label_ja: 肝障害状態
  - id: inflammation
    label_ja: 炎症状態
  - id: myelosuppression
    label_ja: 骨髄抑制状態

variables:
  - id: ALT
    label_ja: ALT
    baseline: 35
    scale: 24
    loadings: { liver_injury: 1.15, inflammation: 0.10, myelosuppression: 0.00 }
    unique_noise: 0.45
  - id: AST
    label_ja: AST
    baseline: 42
    scale: 20
    loadings: { liver_injury: 1.05, inflammation: 0.20, myelosuppression: 0.00 }
    unique_noise: 0.55
  - id: T_Bil
    label_ja: 総ビリルビン
    baseline: 0.4
    scale: 0.20
    loadings: { liver_injury: 0.75, inflammation: 0.00, myelosuppression: 0.00 }
    unique_noise: 0.80
  - id: Alb
    label_ja: アルブミン
    baseline: 4.0
    scale: 0.18
    loadings: { liver_injury: -0.65, inflammation: -0.10, myelosuppression: 0.00 }
    unique_noise: 0.80
  - id: CRP
    label_ja: CRP
    baseline: 0.2
    scale: 0.50
    loadings: { liver_injury: 0.10, inflammation: 1.10, myelosuppression: 0.00 }
    unique_noise: 1.10
  - id: WBC
    label_ja: 白血球数
    baseline: 6.0
    scale: 1.2
    loadings: { liver_injury: 0.00, inflammation: 0.90, myelosuppression: -0.30 }
    unique_noise: 0.85
  - id: Neut
    label_ja: 好中球数
    baseline: 3.0
    scale: 0.85
    loadings: { liver_injury: 0.05, inflammation: 0.85, myelosuppression: -0.25 }
    unique_noise: 0.85
  - id: PLT
    label_ja: 血小板数
    baseline: 300
    scale: 60
    loadings: { liver_injury: -0.15, inflammation: 0.10, myelosuppression: -1.00 }
    unique_noise: 0.65
  - id: Hb
    label_ja: ヘモグロビン
    baseline: 14.0
    scale: 0.9
    loadings: { liver_injury: 0.00, inflammation: -0.10, myelosuppression: -0.80 }
    unique_noise: 0.70
  - id: Retic
    label_ja: 網赤血球
    baseline: 1.2
    scale: 0.40
    loadings: { liver_injury: 0.00, inflammation: 0.10, myelosuppression: -0.65 }
    unique_noise: 0.85

practice:
  default_model: factor_analysis
  default_n_factors: 3
  show_truth_initially: false
