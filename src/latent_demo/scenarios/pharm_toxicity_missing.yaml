scenario:
  id: pharm_toxicity_missing
  title_ja: 欠測を含む検査値データで潜在状態を推定する
  description_ja: >
    一部の検査値が欠測している人工データを扱う。
    実データではすべての測定値がそろうとは限らないため、前処理と潜在変数モデルの関係を確認する。

dataset:
  n_samples: 240
  seed: 2026
  noise_level: 0.80
  missing_rate: 0.15
  standardize: true
  latent_correlation:
    - [1.0, 0.25, 0.05]
    - [0.25, 1.0, 0.10]
    - [0.05, 0.10, 1.0]

latent_factors:
  - id: liver_injury
    label_ja: 肝障害状態
  - id: inflammation
    label_ja: 炎症状態
  - id: myelosuppression
    label_ja: 骨髄抑制状態

variables:
  - id: ALT
    label_ja: ALT
    baseline: 35
    scale: 22
    loadings: { liver_injury: 1.20, inflammation: 0.10, myelosuppression: 0.00 }
    unique_noise: 0.40
  - id: AST
    label_ja: AST
    baseline: 42
    scale: 18
    loadings: { liver_injury: 1.10, inflammation: 0.15, myelosuppression: 0.00 }
    unique_noise: 0.45
  - id: T_Bil
    label_ja: 総ビリルビン
    baseline: 0.4
    scale: 0.18
    loadings: { liver_injury: 0.85, inflammation: 0.00, myelosuppression: 0.00 }
    unique_noise: 0.50
  - id: Alb
    label_ja: アルブミン
    baseline: 4.0
    scale: 0.18
    loadings: { liver_injury: -0.75, inflammation: -0.10, myelosuppression: 0.00 }
    unique_noise: 0.50
  - id: CRP
    label_ja: CRP
    baseline: 0.2
    scale: 0.45
    loadings: { liver_injury: 0.10, inflammation: 1.15, myelosuppression: 0.00 }
    unique_noise: 0.65
  - id: WBC
    label_ja: 白血球数
    baseline: 6.0
    scale: 1.1
    loadings: { liver_injury: 0.00, inflammation: 0.95, myelosuppression: -0.30 }
    unique_noise: 0.55
  - id: Neut
    label_ja: 好中球数
    baseline: 3.0
    scale: 0.8
    loadings: { liver_injury: 0.05, inflammation: 0.90, myelosuppression: -0.25 }
    unique_noise: 0.55
  - id: PLT
    label_ja: 血小板数
    baseline: 300
    scale: 55
    loadings: { liver_injury: -0.15, inflammation: 0.10, myelosuppression: -1.05 }
    unique_noise: 0.50
  - id: Hb
    label_ja: ヘモグロビン
    baseline: 14.0
    scale: 0.9
    loadings: { liver_injury: 0.00, inflammation: -0.10, myelosuppression: -0.80 }
    unique_noise: 0.50
  - id: Retic
    label_ja: 網赤血球
    baseline: 1.2
    scale: 0.35
    loadings: { liver_injury: 0.00, inflammation: 0.10, myelosuppression: -0.75 }
    unique_noise: 0.60

practice:
  default_model: factor_analysis
  default_n_factors: 3
  show_truth_initially: false
